<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F6F7FA;
    --bg-raised:#FFFFFF;
    --bg-sunken:#EEF1F5;
    --ink:#1A2233;
    --ink-soft:#4B5568;
    --ink-faint:#7C8797;
    --rule:#DBE0E8;
    --rule-strong:#C3CAD6;
    --accent:#2B6E68;
    --accent-strong:#1E4F4A;
    --accent-soft:#E4F0EE;
    --accent-2:#B4790A;
    --accent-2-soft:#F7ECD6;
    --danger:#B4402F;
    --danger-soft:#FBEBE8;
    --status-missing:#B4790A;
    --shadow: 0 1px 2px rgba(26,34,51,0.04), 0 6px 20px rgba(26,34,51,0.06);
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F141C; --bg-raised:#171E29; --bg-sunken:#121821;
      --ink:#E7EAF1; --ink-soft:#A6B0C2; --ink-faint:#6D7789;
      --rule:#29323F; --rule-strong:#3A4453;
      --accent:#59B3AB; --accent-strong:#7FCBC3; --accent-soft:#153330;
      --accent-2:#E3A83E; --accent-2-soft:#3A2C10;
      --danger:#E08A7A; --danger-soft:#3A1C16;
      --status-missing:#E3A83E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F141C; --bg-raised:#171E29; --bg-sunken:#121821;
    --ink:#E7EAF1; --ink-soft:#A6B0C2; --ink-faint:#6D7789;
    --rule:#29323F; --rule-strong:#3A4453;
    --accent:#59B3AB; --accent-strong:#7FCBC3; --accent-soft:#153330;
    --accent-2:#E3A83E; --accent-2-soft:#3A2C10;
    --danger:#E08A7A; --danger-soft:#3A1C16;
    --status-missing:#E3A83E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; color:var(--ink); margin:0; text-wrap:balance; }
  p{ margin:0; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  /* ---- layout ---- */
  .wrap{ max-width:720px; margin:0 auto; padding:0 18px; }
  #toasts{ position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:0; right:0; z-index:100; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast{ pointer-events:auto; background:var(--ink); color:var(--bg); font-size:0.86rem; padding:10px 16px; border-radius:8px; box-shadow:var(--shadow); max-width:90vw; }
  .toast.err{ background:var(--danger); color:#fff; }

  /* ---- topbar / nav ---- */
  .topbar{ position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule); }
  .topbar-inner{ max-width:720px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .brand{ font-family:var(--font-display); font-weight:600; font-size:1.05rem; white-space:nowrap; display:flex; align-items:baseline; gap:7px; }
  .brand .dot{ color:var(--accent); }
  .tabs{ display:flex; gap:2px; overflow-x:auto; flex:1; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ font-size:0.82rem; font-weight:500; color:var(--ink-soft); background:none; border:none; padding:7px 11px; border-radius:7px; white-space:nowrap; cursor:pointer; }
  .tab:hover{ background:var(--bg-sunken); color:var(--ink); }
  .tab.active{ background:var(--accent-soft); color:var(--accent-strong); }
  .conn-dot{ width:8px; height:8px; border-radius:50%; background:var(--rule-strong); flex-shrink:0; }
  .conn-dot.ok{ background:var(--accent); }
  .conn-dot.bad{ background:var(--danger); }

  main{ padding:26px 0 60px; }

  /* ---- generic components ---- */
  .card{ background:var(--bg-raised); border:1px solid var(--rule); border-radius:12px; padding:18px 20px; box-shadow:var(--shadow); }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  label{ display:block; font-size:0.78rem; color:var(--ink-soft); margin:0 0 5px; font-weight:500; }
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
    width:100%; background:var(--bg-sunken); border:1px solid var(--rule); color:var(--ink);
    padding:9px 11px; border-radius:8px; font-size:0.92rem;
  }
  textarea{ resize:vertical; min-height:60px; }
  .field{ margin-bottom:12px; }
  .hint{ font-size:0.82rem; color:var(--ink-faint); margin-top:10px; }
  .field:last-child{ margin-bottom:0; }
  .days{ display:flex; flex-wrap:wrap; gap:6px; }
  .daychip{ display:flex; align-items:center; gap:5px; background:var(--bg-sunken); border:1px solid var(--rule); padding:6px 10px; border-radius:100px; font-size:0.8rem; cursor:pointer; }
  .daychip input{ margin:0; }

  button.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:9px; font-weight:600; font-size:0.9rem; cursor:pointer; }
  button.btn:hover{ background:var(--accent-strong); }
  button.btn:disabled{ opacity:0.45; cursor:not-allowed; }
  button.btn.secondary{ background:var(--bg-sunken); color:var(--ink); border:1px solid var(--rule-strong); }
  button.btn.secondary:hover{ background:var(--rule); }
  button.btn.danger{ background:var(--danger-soft); color:var(--danger); }
  button.btn.danger:hover{ opacity:0.85; }
  button.btn.small{ padding:6px 12px; font-size:0.8rem; border-radius:7px; }
  button.link{ background:none; border:none; color:var(--accent); font-size:0.85rem; cursor:pointer; padding:4px 0; font-weight:500; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .pill{ display:inline-block; font-size:0.72rem; font-weight:600; padding:3px 10px; border-radius:100px; font-family:var(--font-mono); background:var(--bg-sunken); color:var(--ink-soft); border:1px solid var(--rule); }
  .pill.easy{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
  .pill.medium{ background:var(--accent-2-soft); color:var(--accent-2); border-color:transparent; }
  .pill.hard{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
  .pill.not_started{ background:var(--bg-sunken); color:var(--ink-faint); }
  .pill.in_progress{ background:var(--accent-2-soft); color:var(--accent-2); border-color:transparent; }
  .pill.completed{ background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; }
  .pill.missed{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }

  .row-item{ background:var(--bg-raised); border:1px solid var(--rule); border-radius:10px; padding:13px 15px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .row-item + .row-item{ margin-top:8px; }
  .row-main{ font-size:0.92rem; }
  .row-sub{ font-size:0.78rem; color:var(--ink-faint); margin-top:2px; }
  .empty{ text-align:center; padding:30px 16px; color:var(--ink-faint); font-size:0.9rem; }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .section-head h2{ font-size:1.3rem; }
  .eyebrow{ font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); font-weight:500; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
  .stat{ background:var(--bg-raised); border:1px solid var(--rule); border-radius:10px; padding:14px; text-align:center; }
  .stat .num{ font-family:var(--font-display); font-size:1.5rem; font-weight:600; color:var(--accent-strong); }
  .stat .label{ font-size:0.72rem; color:var(--ink-faint); margin-top:2px; }

  .bar-track{ height:7px; border-radius:100px; background:var(--bg-sunken); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:100px; }

  /* ---- welcome / auth ---- */
  .auth-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:380px; }
  .auth-brand{ text-align:center; margin-bottom:22px; }
  .auth-brand .dot{ color:var(--accent); }
  .auth-brand h1{ font-size:1.7rem; margin-top:6px; }
  .auth-brand p{ color:var(--ink-soft); font-size:0.9rem; margin-top:8px; }
  .auth-toggle{ display:flex; background:var(--bg-sunken); border-radius:9px; padding:3px; margin-bottom:16px; }
  .auth-toggle button{ flex:1; background:none; border:none; padding:8px; border-radius:7px; font-size:0.85rem; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .auth-toggle button.active{ background:var(--bg-raised); color:var(--ink); box-shadow:var(--shadow); }

  /* ---- connection gate ---- */
  .gate{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
  .gate .card{ max-width:420px; }
  .gate h2{ font-size:1.2rem; margin-bottom:10px; }
  .gate p{ color:var(--ink-soft); font-size:0.9rem; margin-bottom:16px; }
  .gate code{ font-family:var(--font-mono); background:var(--bg-sunken); padding:2px 6px; border-radius:5px; font-size:0.85em; }

  /* ---- timer ---- */
  .timer-face{ text-align:center; padding:30px 0 10px; }
  .timer-clock{ font-family:var(--font-mono); font-size:3.2rem; font-weight:500; letter-spacing:0.02em; color:var(--ink); }
  .timer-state{ font-size:0.82rem; color:var(--ink-faint); margin-top:4px; }

  /* ---- reminder banner ---- */
  .reminder-banner{ background:var(--accent-2-soft); border:1px solid color-mix(in srgb, var(--accent-2) 40%, var(--rule)); border-radius:10px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .reminder-banner p{ font-size:0.85rem; color:var(--ink); }

  .day-group + .day-group{ margin-top:18px; }
  .day-label{ font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px; }

  [hidden]{ display:none !important; }

  @media (max-width:520px){
    .topbar-inner{ padding:10px 14px; gap:10px; }
    main{ padding:18px 0 60px; }
  }
</style>
</head>
<body>

<div id="toasts"></div>
<div id="root"></div>

<script>
'use strict';

// ---------------------------------------------------------------------
// Server address
// ---------------------------------------------------------------------
// Unlike the browser-opened version of this app, this copy runs inside a
// real installed Android app (its own private storage, not a shared
// browser tab), so it's safe to remember the backend address between
// launches with localStorage. Every read/write is wrapped in try/catch:
// a handful of Android WebView setups restrict storage, and this app
// should still work (it'll just ask again next launch) rather than
// crash if that happens.
function readStoredServerUrl() {
  try { return localStorage.getItem('spa_server_url') || ''; } catch (e) { return ''; }
}
function writeStoredServerUrl(url) {
  try { localStorage.setItem('spa_server_url', url); } catch (e) { /* ignore */ }
}

function normalizeServerUrl(raw) {
  let url = (raw || '').trim();
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url.replace(/\/+$/, ''); // strip trailing slash(es)
}

let API = ''; // set by setServerUrl() below, once a server address is known

function setServerUrl(url) {
  API = url ? url + '/api' : '';
}
setServerUrl(readStoredServerUrl());

const state = {
  token: null,
  user: null,
  subjects: [],
  exams: [],
  sessions: [],
  progress: null,
  view: 'home',
  authMode: 'register', // 'register' | 'login'
  connected: null, // null = unknown, true/false once checked
  theme: 'system',
  remindersEnabled: false,
  notifiedSessionIds: new Set(),
  viewingSessionId: null,
  editingSubjectId: null,
  editingExamId: null,
  editingSessionId: null,
  timer: { sessionId: null, running: false, accumulatedMs: 0, lastResumeAt: null },
  editingServerUrl: !readStoredServerUrl(), // true = show the "connect to server" form
};

// ---------------------------------------------------------------------
// API helper
// ---------------------------------------------------------------------

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  let res, data;
  try {
    res = await fetch(API + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  } catch (e) {
    state.connected = false;
    render();
    throw new Error('offline');
  }
  data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Request failed');
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function toast(message, isError) {
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' err' : '');
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

function errMsg(e) {
  return (e && e.data && e.data.error) ? e.data.error : (e && e.message) || 'Something went wrong';
}

// ---------------------------------------------------------------------
// Connection check
// ---------------------------------------------------------------------

function healthUrl() {
  return API.replace(/\/api$/, '') + '/health';
}

async function pingHealth() {
  if (!API) { state.connected = false; return; }
  try {
    const r = await fetch(healthUrl());
    state.connected = r.ok;
  } catch (e) {
    state.connected = false;
  }
}

// ---------------------------------------------------------------------
// Connect-to-server screen (first launch, or "Change server" later)
// ---------------------------------------------------------------------

function editServerUrl() {
  state.editingServerUrl = true;
  render();
}

async function connectToServer() {
  const input = document.getElementById('server-url-input');
  const url = normalizeServerUrl(input ? input.value : '');
  if (!url) {
    toast('Enter your server address first', true);
    return;
  }
  writeStoredServerUrl(url);
  setServerUrl(url);
  state.editingServerUrl = false;
  state.connected = null;
  render();
  await pingHealth();
  if (!state.connected) toast("Saved it, but can't reach that address yet - check it and try again", true);
  render();
}

// ---------------------------------------------------------------------
// Navigation
// ---------------------------------------------------------------------

function go(view) {
  state.view = view;
  render();
  window.scrollTo(0, 0);
}

function isSetupDone() {
  return !!(state.user && Array.isArray(state.user.available_days) && state.user.available_days.length > 0);
}

async function logout() {
  state.token = null;
  state.user = null;
  state.subjects = [];
  state.exams = [];
  state.sessions = [];
  state.progress = null;
  state.timer = { sessionId: null, running: false, accumulatedMs: 0, lastResumeAt: null };
  state.view = 'home';
  render();
}

// ---------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------

async function loadAll() {
  try {
    const [subjects, exams, sessions, progress] = await Promise.all([
      api('GET', '/subjects'),
      api('GET', '/exams'),
      api('GET', '/sessions'),
      api('GET', '/progress'),
    ]);
    state.subjects = subjects;
    state.exams = exams;
    state.sessions = sessions;
    state.progress = progress;
  } catch (e) {
    toast(errMsg(e), true);
  }
}

async function refreshSessions() {
  try { state.sessions = await api('GET', '/sessions'); } catch (e) { /* toasted elsewhere */ }
}
async function refreshProgress() {
  try { state.progress = await api('GET', '/progress'); } catch (e) { /* ignore */ }
}

// ---------------------------------------------------------------------
// Render root
// ---------------------------------------------------------------------

function render() {
  const root = document.getElementById('root');

  if (state.editingServerUrl) {
    root.innerHTML = serverSetupTemplate();
    return;
  }

  if (state.connected === false) {
    root.innerHTML = gateTemplate();
    return;
  }

  if (!state.token) {
    root.innerHTML = authTemplate();
    return;
  }

  if (!isSetupDone()) {
    root.innerHTML = shell(setupTemplate(), 'setup');
    return;
  }

  root.innerHTML = shell(viewTemplate(), state.view);
}

function serverSetupTemplate() {
  const current = readStoredServerUrl();
  return `
    <div class="gate">
      <div class="card">
        <h2>Connect to your Student Planner server</h2>
        <p>This app needs the address of your hosted Student Planner backend (the one you set up online) to sign in and save your data.</p>
        <div class="field">
          <label>Server address</label>
          <input id="server-url-input" type="text" inputmode="url" autocapitalize="off" autocorrect="off"
            placeholder="https://your-app-name.onrender.com" value="${escapeHtml(current)}">
        </div>
        <button class="btn" onclick="connectToServer()">Save &amp; connect</button>
        <p class="hint">You only need to do this once - the app remembers it after that.</p>
      </div>
    </div>`;
}

function gateTemplate() {
  return `
    <div class="gate">
      <div class="card">
        <h2>Can't reach your server</h2>
        <p>This app is trying to reach <code>${healthUrl().replace('/health','')}</code>, and it's not responding right now.</p>
        <p>Check that address is correct and that your server is online, then try again.</p>
        <button class="btn" onclick="retryConnection()">Try again</button>
        <button class="btn secondary" onclick="editServerUrl()">Change server address</button>
      </div>
    </div>`;
}

async function retryConnection() {
  await pingHealth();
  render();
}

function shell(innerHtml, activeTab) {
  const tabs = [
    ['home', 'Home'], ['subjects', 'Subjects'], ['planner', 'Planner'],
    ['progress', 'Progress'], ['profile', 'Profile'],
  ];
  return `
    <div class="topbar">
      <div class="topbar-inner">
        <span class="conn-dot ${state.connected ? 'ok' : 'bad'}" title="${state.connected ? 'Connected' : 'Not connected'}"></span>
        <div class="brand"><span class="dot">&#9670;</span> Student Planner</div>
        <nav class="tabs">
          ${tabs.map(([id, label]) => `<button class="tab ${activeTab === id ? 'active' : ''}" onclick="go('${id}')">${label}</button>`).join('')}
        </nav>
      </div>
    </div>
    <main class="wrap">${reminderBannerTemplate()}${innerHtml}</main>`;
}

// ---------------------------------------------------------------------
// In-tab reminders (no server push - just checks sessions already
// loaded into the app while this tab stays open, per the Profile
// screen's toggle)
// ---------------------------------------------------------------------

let activeReminder = null;

function tickReminders() {
  if (!state.remindersEnabled || !state.token || !isSetupDone()) return;
  const now = new Date();
  for (const s of state.sessions) {
    if (s.status !== 'not_started') continue;
    if (state.notifiedSessionIds.has(s.session_id)) continue;
    const start = new Date(s.session_date + 'T' + s.start_time + ':00');
    const diffMin = (start - now) / 60000;
    if (diffMin <= 0 && diffMin > -90) {
      state.notifiedSessionIds.add(s.session_id);
      activeReminder = s;
      render();
      return;
    }
  }
}

function reminderBannerTemplate() {
  if (!activeReminder) return '';
  const s = activeReminder;
  return `
    <div class="reminder-banner">
      <p><strong>${escapeHtml(subjectName(s.subject_id))}</strong> was due at ${fmtTime(s.start_time)} today.</p>
      <div class="btn-row">
        <button class="btn small" onclick="dismissReminder(); goToSession('${s.session_id}')">Start now</button>
        <button class="btn small secondary" onclick="dismissReminder()">Dismiss</button>
      </div>
    </div>`;
}

function dismissReminder() {
  activeReminder = null;
  render();
}

function viewTemplate() {
  switch (state.view) {
    case 'subjects': return subjectsTemplate();
    case 'planner': return plannerTemplate();
    case 'session': return sessionTemplate();
    case 'progress': return progressTemplate();
    case 'profile': return profileTemplate();
    case 'home':
    default: return homeTemplate();
  }
}

// ---------------------------------------------------------------------
// Small formatting helpers
// ---------------------------------------------------------------------

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtTime(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2, '0')} ${period}`;
}
function subjectName(id) {
  const s = state.subjects.find(s => s.subject_id === id);
  return s ? s.subject_name : 'Subject';
}
function daysUntil(iso) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const target = new Date(iso + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------------
// Welcome / sign up / log in
// ---------------------------------------------------------------------

function authTemplate() {
  const isRegister = state.authMode === 'register';
  return `
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-brand">
          <div style="color:var(--accent); font-size:1.4rem;">&#9670;</div>
          <h1>Student Planner</h1>
          <p>Turn your subjects and exam dates into a study timetable you'll actually follow.</p>
        </div>
        <div class="card">
          <div class="auth-toggle">
            <button type="button" class="${isRegister ? 'active' : ''}" onclick="setAuthMode('register')">Sign up</button>
            <button type="button" class="${!isRegister ? 'active' : ''}" onclick="setAuthMode('login')">Log in</button>
          </div>
          <form onsubmit="return handleAuthSubmit(event)">
            <div class="stack">
              ${isRegister ? `
              <div class="field">
                <label>Name</label>
                <input type="text" id="auth-name" placeholder="Your name" required>
              </div>` : ''}
              <div class="field">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="you@example.com" required>
              </div>
              <div class="field">
                <label>Password</label>
                <input type="password" id="auth-password" placeholder="${isRegister ? 'At least 8 characters' : 'Your password'}" required>
              </div>
              <button class="btn" type="submit" id="auth-submit-btn" style="width:100%;">${isRegister ? 'Create account' : 'Log in'}</button>
            </div>
          </form>
        </div>
      </div>
    </div>`;
}

function setAuthMode(mode) {
  state.authMode = mode;
  render();
}

async function handleAuthSubmit(evt) {
  evt.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true;
  try {
    let data;
    if (state.authMode === 'register') {
      const name = document.getElementById('auth-name').value.trim();
      data = await api('POST', '/auth/register', { name, email, password });
    } else {
      data = await api('POST', '/auth/login', { email, password });
    }
    state.token = data.token;
    state.user = data.user;
    toast(`Welcome${state.authMode === 'register' ? '' : ' back'}, ${data.user.name}.`);
    await loadAll();
    state.view = 'home';
    render();
  } catch (e) {
    toast(errMsg(e), true);
    if (document.getElementById('auth-submit-btn')) document.getElementById('auth-submit-btn').disabled = false;
  }
  return false;
}

const ALL_DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DAY_LABELS = { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };

function setupTemplate() {
  const goal = (state.user && state.user.study_goal) || '';
  const time = (state.user && state.user.preferred_study_time) || 'evening';
  const defaultChecked = ['mon', 'tue', 'wed', 'thu', 'fri'];
  return `
    <div class="stack">
      <div>
        <div class="eyebrow">Before we start</div>
        <h2 style="font-size:1.5rem; margin-top:6px;">Set up your study plan</h2>
        <p style="color:var(--ink-soft); font-size:0.9rem; margin-top:6px;">Tell us how you study, and — if you're ready — your first subject and exam, and we'll build your first timetable.</p>
      </div>

      <div class="card stack">
        <div class="field">
          <label>Study goal</label>
          <input type="text" id="setup-goal" placeholder="e.g. WASSCE preparation" value="${escapeHtml(goal)}">
        </div>
        <div class="field">
          <label>Preferred study time</label>
          <select id="setup-time">
            <option value="morning" ${time === 'morning' ? 'selected' : ''}>Morning</option>
            <option value="afternoon" ${time === 'afternoon' ? 'selected' : ''}>Afternoon</option>
            <option value="evening" ${time === 'evening' ? 'selected' : ''}>Evening</option>
          </select>
        </div>
        <div class="field">
          <label>Which days can you study?</label>
          <div class="days" id="setup-days">
            ${ALL_DAYS.map(d => `<label class="daychip"><input type="checkbox" value="${d}" ${defaultChecked.includes(d) ? 'checked' : ''}> ${DAY_LABELS[d]}</label>`).join('')}
          </div>
        </div>
      </div>

      <div class="card stack">
        <strong style="font-size:0.92rem;">Your first subject <span style="font-weight:400; color:var(--ink-faint);">(optional — you'll need at least one to generate a plan)</span></strong>
        <div class="field">
          <label>Subject name</label>
          <input type="text" id="setup-subject-name" placeholder="e.g. Core Mathematics">
        </div>
        <div class="field">
          <label>Difficulty</label>
          <select id="setup-subject-difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="field">
          <label>Exam name (optional)</label>
          <input type="text" id="setup-exam-name" placeholder="e.g. WASSCE Core Maths">
        </div>
        <div class="field">
          <label>Exam date (optional)</label>
          <input type="date" id="setup-exam-date">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" onclick="completeSetup()" id="setup-submit-btn">Save and generate my plan</button>
        <button class="btn secondary" onclick="skipSetup()">Skip for now</button>
      </div>
    </div>`;
}

async function completeSetup() {
  const btn = document.getElementById('setup-submit-btn');
  btn.disabled = true;
  const goal = document.getElementById('setup-goal').value.trim();
  const time = document.getElementById('setup-time').value;
  const days = [...document.querySelectorAll('#setup-days input:checked')].map(c => c.value);
  if (days.length === 0) {
    toast('Pick at least one study day.', true);
    btn.disabled = false;
    return;
  }
  try {
    state.user = await api('PATCH', '/users/me', { study_goal: goal, preferred_study_time: time, available_days: days });

    const subjName = document.getElementById('setup-subject-name').value.trim();
    if (subjName) {
      const difficulty = document.getElementById('setup-subject-difficulty').value;
      const subject = await api('POST', '/subjects', { subject_name: subjName, difficulty });
      state.subjects.push(subject);

      const examName = document.getElementById('setup-exam-name').value.trim();
      const examDate = document.getElementById('setup-exam-date').value;
      if (examName && examDate) {
        const exam = await api('POST', '/exams', { subject_id: subject.subject_id, exam_name: examName, exam_date: examDate });
        state.exams.push(exam);
      }

      try {
        state.sessions = await api('POST', '/sessions/generate');
        toast('Your study plan is ready.');
      } catch (e2) {
        toast(errMsg(e2), true);
      }
    } else {
      toast('Setup saved — add a subject any time to generate your plan.');
    }

    await refreshProgress();
    state.view = 'home';
    render();
  } catch (e) {
    toast(errMsg(e), true);
    if (document.getElementById('setup-submit-btn')) document.getElementById('setup-submit-btn').disabled = false;
  }
}

async function skipSetup() {
  try {
    state.user = await api('PATCH', '/users/me', { available_days: ['mon', 'tue', 'wed', 'thu', 'fri'] });
    toast('You can change your study days any time in Profile.');
    state.view = 'home';
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

function homeTemplate() {
  const name = state.user ? state.user.name : '';
  const today = todayStr();
  const upcoming = state.sessions
    .filter(s => s.status === 'not_started' || s.status === 'in_progress')
    .sort((a, b) => (a.session_date + a.start_time).localeCompare(b.session_date + b.start_time));
  const todaysSessions = upcoming.filter(s => s.session_date === today);
  const nextSession = upcoming[0];

  const exams = [...state.exams]
    .filter(e => daysUntil(e.exam_date) >= 0)
    .sort((a, b) => a.exam_date.localeCompare(b.exam_date))
    .slice(0, 3);

  const p = state.progress;

  return `
    <div class="stack">
      <div>
        <div class="eyebrow">Today</div>
        <h2 style="font-size:1.6rem; margin-top:6px;">Hi ${escapeHtml(name)}</h2>
      </div>

      ${p ? `
      <div class="stat-grid">
        <div class="stat"><div class="num">${p.studyTime.week}</div><div class="label">min this week</div></div>
        <div class="stat"><div class="num">${p.streak}</div><div class="label">day streak</div></div>
        <div class="stat"><div class="num">${p.goalProgress}%</div><div class="label">overall progress</div></div>
      </div>` : ''}

      <div class="section-head"><h2 style="font-size:1.1rem;">Today's sessions</h2></div>
      <div>${todaysSessions.length ? todaysSessions.map(sessionRow).join('') : `<div class="empty">Nothing scheduled for today.${state.sessions.length === 0 ? ' Generate a plan from the Planner tab.' : ''}</div>`}</div>

      ${!todaysSessions.length && nextSession ? `
        <div class="card">
          <div class="row-main">Next up: <strong>${escapeHtml(subjectName(nextSession.subject_id))}</strong></div>
          <div class="row-sub">${fmtDate(nextSession.session_date)} at ${fmtTime(nextSession.start_time)}</div>
          <div class="btn-row" style="margin-top:10px;"><button class="btn small" onclick="goToSession('${nextSession.session_id}')">Start studying</button></div>
        </div>` : ''}

      <div class="section-head"><h2 style="font-size:1.1rem;">Upcoming exams</h2></div>
      <div>${exams.length ? exams.map(examRowSmall).join('') : `<div class="empty">No upcoming exams yet.</div>`}</div>

      <div class="btn-row">
        <button class="btn secondary" onclick="go('planner')">View full planner</button>
      </div>
    </div>`;
}

function sessionRow(s) {
  return `
    <div class="row-item">
      <div>
        <div class="row-main">${fmtTime(s.start_time)} &middot; ${escapeHtml(subjectName(s.subject_id))}</div>
        <div class="row-sub">${escapeHtml(s.topic || 'General review')} &middot; ${s.duration_minutes} min</div>
      </div>
      <div class="btn-row">
        <span class="pill ${s.status}">${s.status.replace('_', ' ')}</span>
        ${s.status === 'not_started' ? `<button class="btn small" onclick="goToSession('${s.session_id}')">Start</button>` : ''}
        ${s.status === 'in_progress' ? `<button class="btn small" onclick="goToSession('${s.session_id}')">Continue</button>` : ''}
      </div>
    </div>`;
}

function examRowSmall(e) {
  const days = daysUntil(e.exam_date);
  return `
    <div class="row-item">
      <div>
        <div class="row-main">${escapeHtml(e.exam_name)}</div>
        <div class="row-sub">${escapeHtml(subjectName(e.subject_id))} &middot; ${fmtDate(e.exam_date)}</div>

function goToSession(sessionId) {

async function addSubject() {
  const nameEl = document.getElementById('new-subject-name');
  const name = nameEl.value.trim();
  if (!name) { toast('Enter a subject name.', true); return; }
  const difficulty = document.getElementById('new-subject-difficulty').value;
  try {
    const subject = await api('POST', '/subjects', { subject_name: name, difficulty });
    state.subjects.push(subject);
    toast(`Added "${subject.subject_name}".`);
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

function editSubject(id) { state.editingSubjectId = id; render(); }
function cancelSubjectEdit() { state.editingSubjectId = null; render(); }

async function saveSubjectEdit(id) {
  const name = document.getElementById(`edit-subject-name-${id}`).value.trim();
  const difficulty = document.getElementById(`edit-subject-difficulty-${id}`).value;
  if (!name) { toast('Enter a subject name.', true); return; }
  try {
    const updated = await api('PATCH', `/subjects/${id}`, { subject_name: name, difficulty });
    state.subjects = state.subjects.map(s => s.subject_id === id ? updated : s);
    state.editingSubjectId = null;
    toast('Subject updated.');
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

async function deleteSubject(id) {
  if (!confirm('Delete this subject? This also removes its exams and study sessions.')) return;
  try {
    await api('DELETE', `/subjects/${id}`);
    state.subjects = state.subjects.filter(s => s.subject_id !== id);
    state.exams = state.exams.filter(e => e.subject_id !== id);
    state.sessions = state.sessions.filter(s => s.subject_id !== id);
    toast('Subject deleted.');
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

function plannerTemplate() {
  const grouped = {};
  for (const s of [...state.sessions].sort((a, b) => (a.session_date + a.start_time).localeCompare(b.session_date + b.start_time))) {
    (grouped[s.session_date] = grouped[s.session_date] || []).push(s);
  }
  const dates = Object.keys(grouped).sort();

  return `
    <div class="stack">
      <div class="section-head"><h2>Study Planner</h2></div>

      <div class="card stack">
        <p style="font-size:0.85rem; color:var(--ink-soft);">Generating keeps anything you've already started, completed, or hand-edited - only future, not-yet-started sessions get replaced.</p>
        <button class="btn" onclick="generatePlan()" id="generate-btn" ${state.subjects.length === 0 ? 'disabled' : ''}>${state.sessions.length ? 'Regenerate timetable' : 'Generate timetable'}</button>
        ${state.subjects.length === 0 ? '<p style="font-size:0.8rem; color:var(--ink-faint);">Add a subject first (Subjects tab).</p>' : ''}
      </div>

      <div class="card stack">
        <strong style="font-size:0.9rem;">Add a session manually</strong>
        ${state.subjects.length === 0 ? '<p style="font-size:0.8rem; color:var(--ink-faint);">Add a subject first.</p>' : `
        <div class="field"><label>Subject</label><select id="new-session-subject">${state.subjects.map(s => `<option value="${s.subject_id}">${escapeHtml(s.subject_name)}</option>`).join('')}</select></div>
        <div class="field"><label>Topic (optional)</label><input type="text" id="new-session-topic" placeholder="e.g. Algebra: quadratic equations"></div>
        <div class="field"><label>Date</label><input type="date" id="new-session-date" value="${todayStr()}"></div>
        <div class="field"><label>Start time</label><input type="time" id="new-session-time" value="18:00"></div>
        <div class="field"><label>Duration (minutes)</label><input type="number" id="new-session-duration" value="60" min="10" step="5"></div>
        <button class="btn secondary" onclick="addSession()">Add session</button>`}
      </div>

      ${dates.length ? dates.map(d => `
        <div class="day-group">
          <div class="day-label">${fmtDate(d)}</div>
          ${grouped[d].map(plannerRow).join('')}
        </div>`).join('') : '<div class="empty">No sessions yet - generate a plan above.</div>'}
    </div>`;
}

function plannerRow(s) {

      <div class="row-item" style="flex-direction:column; align-items:stretch;">

        <div class="btn-row">
          <button class="btn small" onclick="saveSessionEdit('${s.session_id}')">Save</button>
          <button class="btn small secondary" onclick="cancelSessionEdit()">Cancel</button>
        </div>
      </div>`;
  }
  return `
    <div class="row-item">
      <div>
        <div class="row-main">${fmtTime(s.start_time)} &middot; ${escapeHtml(subjectName(s.subject_id))}</div>

      </div>
      <div class="btn-row">

        <button class="btn small danger" onclick="deleteSession('${s.session_id}')">Delete</button>
      </div>
    </div>`;
}

async function generatePlan() {
  const btn = document.getElementById('generate-btn');
  if (btn) btn.disabled = true;
  try {
    state.sessions = await api('POST', '/sessions/generate');
    toast(`Generated ${state.sessions.length} study session(s).`);
    await refreshProgress();
    render();
  } catch (e) {
    toast(errMsg(e), true);
    if (document.getElementById('generate-btn')) document.getElementById('generate-btn').disabled = false;
  }
}

async function addSession() {
  const subjectId = document.getElementById('new-session-subject').value;
  const topic = document.getElementById('new-session-topic').value.trim();
  const date = document.getElementById('new-session-date').value;
  const time = document.getElementById('new-session-time').value;
  const duration = Number(document.getElementById('new-session-duration').value) || 60;
  if (!date || !time) { toast('Pick a date and time.', true); return; }
  try {
    const session = await api('POST', '/sessions', {
      subject_id: subjectId, topic: topic || undefined, session_date: date, start_time: time, duration_minutes: duration,
    });
    state.sessions.push(session);
    toast('Session added.');
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

function editSessionRow(id) { state.editingSessionId = id; render(); }
function cancelSessionEdit() { state.editingSessionId = null; render(); }

async function saveSessionEdit(id) {
  const topic = document.getElementById(`edit-session-topic-${id}`).value.trim();
  const date = document.getElementById(`edit-session-date-${id}`).value;
  const time = document.getElementById(`edit-session-time-${id}`).value;
  const duration = Number(document.getElementById(`edit-session-duration-${id}`).value) || 60;
  try {
    const updated = await api('PATCH', `/sessions/${id}`, { topic, session_date: date, start_time: time, duration_minutes: duration });
    state.sessions = state.sessions.map(s => s.session_id === id ? updated : s);
    state.editingSessionId = null;
    toast('Session updated.');
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

async function deleteSession(id) {
  if (!confirm('Delete this session?')) return;
  try {
    await api('DELETE', `/sessions/${id}`);
    state.sessions = state.sessions.filter(s => s.session_id !== id);
    toast('Session deleted.');
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

// ---------------------------------------------------------------------
// Study Session (focus timer)
// ---------------------------------------------------------------------

let timerTickHandle = null;

function isTimerFor(sessionId) {
  return state.timer.sessionId === sessionId;
}

function timerElapsedMs() {
  if (!state.timer.sessionId) return 0;
  let ms = state.timer.accumulatedMs;
  if (state.timer.running && state.timer.lastResumeAt) ms += (Date.now() - state.timer.lastResumeAt);
  return ms;
}

function fmtClock(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function ensureTimerTick() {
  if (timerTickHandle) return;
  timerTickHandle = setInterval(() => {
    if (state.timer.running) {
      const el = document.getElementById('timer-clock');
      if (el) el.textContent = fmtClock(timerElapsedMs());
    }
  }, 1000);
}

function sessionTemplate() {
  const session = state.sessions.find(s => s.session_id === state.viewingSessionId);
  if (!session) {
    return `<div class="empty">No session selected. <button class="link" onclick="go('planner')">Go to the Planner</button></div>`;
  }

  if (session.status === 'completed') {
    return `
      <div class="stack">
        <div class="section-head"><h2>Study Session</h2></div>
        <div class="card" style="text-align:center;">
          <div class="eyebrow">Completed</div>
          <h2 style="margin-top:8px;">${escapeHtml(subjectName(session.subject_id))}</h2>
          <p style="color:var(--ink-soft); margin-top:6px;">${escapeHtml(session.topic || 'General review')}</p>
          <p style="margin-top:14px; font-family:var(--font-mono);">${session.actual_duration_minutes} minutes logged</p>
          <div class="btn-row" style="justify-content:center; margin-top:16px;">
            <button class="btn secondary" onclick="go('planner')">Back to Planner</button>
          </div>
        </div>
      </div>`;
  }

  const timerIsMine = isTimerFor(session.session_id);
  const elapsed = timerIsMine ? timerElapsedMs() : 0;
  const running = timerIsMine && state.timer.running;
  const started = session.status === 'in_progress' || timerIsMine;

  return `
    <div class="stack">
      <div class="section-head"><h2>Study Session</h2></div>
      <div class="card stack" style="align-items:center; text-align:center;">
        <div class="eyebrow">${escapeHtml(subjectName(session.subject_id))}</div>
        <p style="font-size:0.95rem; color:var(--ink-soft);">${escapeHtml(session.topic || 'General review')}</p>
        ${state.user && state.user.study_goal ? `<p style="font-size:0.8rem; color:var(--ink-faint);">Goal: ${escapeHtml(state.user.study_goal)}</p>` : ''}
        <p style="font-size:0.78rem; color:var(--ink-faint);">Planned: ${fmtDate(session.session_date)} at ${fmtTime(session.start_time)} &middot; ${session.duration_minutes} min</p>

        <div class="timer-face">
          <div class="timer-clock" id="timer-clock">${fmtClock(elapsed)}</div>
          <div class="timer-state">${!started ? 'Not started yet' : running ? 'Running' : 'Paused'}</div>
        </div>

        <div class="btn-row" style="justify-content:center;">
          ${!started ? `<button class="btn" onclick="startSessionTimer('${session.session_id}')">Start session</button>` : ''}
          ${started && running ? `<button class="btn secondary" onclick="pauseSessionTimer()">Pause</button>` : ''}
          ${started && !running ? `<button class="btn secondary" onclick="resumeSessionTimer('${session.session_id}')">Resume</button>` : ''}
          ${started ? `<button class="btn" onclick="finishSessionTimer('${session.session_id}')">Finish session</button>` : ''}
        </div>
      </div>
    </div>`;
}

async function startSessionTimer(sessionId) {
  if (state.timer.sessionId && state.timer.sessionId !== sessionId) {
    toast('Finish your current session first, or go back to it from the Planner.', true);
    return;
  }
  try {
    const updated = await api('POST', `/sessions/${sessionId}/start`);
    state.sessions = state.sessions.map(s => s.session_id === sessionId ? updated : s);
    state.timer = { sessionId, running: true, accumulatedMs: 0, lastResumeAt: Date.now() };
    ensureTimerTick();
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

function resumeSessionTimer(sessionId) {
  if (state.timer.sessionId && state.timer.sessionId !== sessionId) {
    toast('Finish your current session first, or go back to it from the Planner.', true);
    return;
  }
  if (!isTimerFor(sessionId)) {
    // No local timer state for this session (e.g. it was already
    // in_progress from earlier) - count from zero, since exact elapsed
    // time before now isn't tracked server-side (see the backend README).
    state.timer = { sessionId, running: true, accumulatedMs: 0, lastResumeAt: Date.now() };
  } else {
    state.timer.running = true;
    state.timer.lastResumeAt = Date.now();
  }
  ensureTimerTick();
  render();
}

function pauseSessionTimer() {
  if (!state.timer.sessionId || !state.timer.running) return;
  state.timer.accumulatedMs += Date.now() - state.timer.lastResumeAt;
  state.timer.running = false;
  state.timer.lastResumeAt = null;
  render();
}

async function finishSessionTimer(sessionId) {
  const ms = isTimerFor(sessionId) ? timerElapsedMs() : 0;
  const minutes = Math.max(1, Math.round(ms / 60000));
  try {
    const updated = await api('POST', `/sessions/${sessionId}/complete`, { actual_duration_minutes: minutes });
    state.sessions = state.sessions.map(s => s.session_id === sessionId ? updated : s);
    if (isTimerFor(sessionId)) {
      state.timer = { sessionId: null, running: false, accumulatedMs: 0, lastResumeAt: null };
    }
    toast(`Nice work - logged ${minutes} minute(s).`);
    await refreshProgress();
    render();
  } catch (e) {
    toast(errMsg(e), true);
  }
}

// ---------------------------------------------------------------------
// Progress
// ---------------------------------------------------------------------

function progressTemplate() {
  const p = state.progress;
  if (!p) return `<div class="empty">Loading...</div>`;
  return `
    <div class="stack">
      <div class="section-head"><h2>Progress</h2><button class="btn small secondary" onclick="reloadProgress()">Refresh</button></div>

      <div class="stat-grid">
        <div class="stat"><div class="num">${p.studyTime.today}</div><div class="label">min today</div></div>
        <div class="stat"><div class="num">${p.studyTime.week}</div><div class="label">min this week</div></div>
        <div class="stat"><div class="num">${p.studyTime.month}</div><div class="label">min this month</div></div>
        <div class="stat"><div class="num">${p.sessions.completed}/${p.sessions.planned}</div><div class="label">sessions done</div></div>
        <div class="stat"><div class="num">${p.streak}</div><div class="label">day streak</div></div>
        <div class="stat"><div class="num">${p.goalProgress}%</div><div class="label">overall progress</div></div>
        <div class="stat"><div class="num">${p.sessions.missed}</div><div class="label">missed</div></div>
      </div>

      <div class="section-head" style="margin-top:6px;"><h2 style="font-size:1.1rem;">By subject</h2></div>
      <div class="stack">${p.subjectProgress.length ? p.subjectProgress.map(subjectProgressRow).join('') : '<div class="empty">No subjects yet.</div>'}</div>

      ${p.needsAttention.length ? `
      <div class="section-head" style="margin-top:6px;"><h2 style="font-size:1.1rem;">Needs attention</h2></div>
      <div class="stack">${p.needsAttention.map(subjectProgressRow).join('')}</div>` : ''}
    </div>`;
}

function subjectProgressRow(sp) {
  return `
    <div class="card" style="padding:14px 16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.88rem; margin-bottom:8px; gap:10px; flex-wrap:wrap;">
        <span>${escapeHtml(sp.subject_name)} <span class="pill ${sp.difficulty}">${sp.difficulty}</span></span>
        <span style="color:var(--ink-faint);">${sp.completed}/${sp.planned} &middot; ${sp.percent}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${sp.percent}%;"></div></div>
    </div>`;
}

async function reloadProgress() {
  await refreshProgress();
  toast('Progress refreshed.');
  render();
}

// ---------------------------------------------------------------------
// Profile & Settings
// ---------------------------------------------------------------------

function profileTemplate() {
  const u = state.user || {};
  const days = u.available_days || [];
  return `
    <div class="stack">
      <div class="section-head"><h2>Profile &amp; Settings</h2></div>

      <div class="card stack">
        <div class="field"><label>Name</label><input type="text" id="profile-name" value="${escapeHtml(u.name || '')}"></div>
        <div class="field"><label>Email</label><input type="text" value="${escapeHtml(u.email || '')}" disabled style="opacity:0.6;"></div>
        <div class="field"><label>Study goal</label><input type="text" id="profile-goal" value="${escapeHtml(u.study_goal || '')}" placeholder="e.g. WASSCE preparation"></div>
        <div class="field"><label>Preferred study time</label>
          <select id="profile-time">
            <option value="morning" ${u.preferred_study_time === 'morning' ? 'selected' : ''}>Morning</option>
            <option value="afternoon" ${u.preferred_study_time === 'afternoon' ? 'selected' : ''}>Afternoon</option>
            <option value="evening" ${u.preferred_study_time === 'evening' ? 'selected' : ''}>Evening</option>
          </select>
        </div>
        <div class="field">
          <label>Available study days</label>
          <div class="days" id="profile-days">
            ${ALL_DAYS.map(d => `<label class="daychip"><input type="checkbox" value="${d}" ${days.includes(d) ? 'checked' : ''}> ${DAY_LABELS[d]}</label>`).join('')}
          </div>
        </div>
        <button class="btn" onclick="saveProfile()" id="profile-save-btn">Save changes</button>
      </div>

      <div class="card stack">
        <strong style="font-size:0.9rem;">Appearance</strong>
        <div class="field">
          <label>Theme</label>
          <select id="profile-theme" onchange="setTheme(this.value)">
            <option value="system" ${state.theme === 'system' ? 'selected' : ''}>Match my system</option>
            <option value="light" ${state.theme === 'light' ? 'selected' : ''}>Light</option>
            <option value="dark" ${state.theme === 'dark' ? 'selected' : ''}>Dark</option>
          </select>
        </div>
      </div>

      <div class="card stack">
        <strong style="font-size:0.9rem;">Reminders</strong>
        <label class="daychip" style="width:fit-content;">
          <input type="checkbox" id="profile-reminders" ${state.remindersEnabled ? 'checked' : ''} onchange="toggleReminders(this.checked)">
          Show a reminder banner if a session is due
        </label>
        <p style="font-size:0.78rem; color:var(--ink-faint);">This checks sessions already loaded into the app and only works while this tab stays open - it's not a push notification.</p>
      </div>

      <div class="card stack">
        <strong style="font-size:0.9rem;">Server</strong>
        <p style="font-size:0.78rem; color:var(--ink-faint);">Currently connected to: <code>${escapeHtml(readStoredServerUrl() || '(none)')}</code></p>
        <button class="btn secondary" onclick="editServerUrl()">Change server address</button>
      </div>

      <div class="card stack">
        <button class="btn danger" onclick="logout()">Log out</button>
      </div>
    </div>`;
}

async function saveProfile() {
  const btn = document.getElementById('profile-save-btn');
  btn.disabled = true;
  const name = document.getElementById('profile-name').value.trim();
  const goal = document.getElementById('profile-goal').value.trim();
  const time = document.getElementById('profile-time').value;
  const days = [...document.querySelectorAll('#profile-days input:checked')].map(c => c.value);
  if (days.length === 0) { toast('Pick at least one study day.', true); btn.disabled = false; return; }
  try {
    state.user = await api('PATCH', '/users/me', { name, study_goal: goal, preferred_study_time: time, available_days: days });
    toast('Profile updated.');
    render();
  } catch (e) {
    toast(errMsg(e), true);
    if (document.getElementById('profile-save-btn')) document.getElementById('profile-save-btn').disabled = false;
  }
}

function setTheme(value) {
  state.theme = value;
  applyTheme();
}

function applyTheme() {
  if (state.theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
}

function toggleReminders(checked) {
  state.remindersEnabled = checked;
  if (checked) toast('Reminders on for this tab.');
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------

(async function init() {
  render();
  await pingHealth();
  render();
  setInterval(async () => {
    if (state.editingServerUrl) return; // don't wipe out mid-typed input on the connect screen
    await pingHealth();
    render();
  }, 15000);
  setInterval(tickReminders, 60000);
})();
</script>
